<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Jarrett Adams | Opportunity portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#F4EDDE;  /* page */
  --paper:#FCF9F2;      /* lists and panels */
  --ink:#1B241E;
  --forest:#24402F;
  --forest-deep:#18291F;
  --gold:#A98736;
  --gold-soft:#D3B66C;
  --gold-ink:#7E6420;
  --brick:#A3402A;
  --sage:#5E6E5B;
  --divider:#EEE5D2;
  --hover:#F7F1E4;
  --lift:0 1px 2px rgba(70,55,20,.05), 0 10px 28px rgba(70,55,20,.07);
  --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--forest);text-decoration-thickness:1px;text-underline-offset:3px}
p{margin:0}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:8px}
.wrap{max-width:1100px;margin:0 auto;padding:0 26px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--forest-deep);box-shadow:0 6px 24px rgba(24,41,31,.18)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px}
.brand{margin:0;white-space:nowrap;font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;color:#fff}
.brand span{font-family:var(--sans);font-weight:500;font-size:13.5px;color:var(--gold-soft);margin-left:12px}
.account{display:flex;gap:14px;align-items:center;font-size:13.5px;color:#C2CBC0;text-align:right}
.account a{color:#C2CBC0}
.account a:hover{color:#fff}
.account .bad{color:#F0A08C}
.tabs{display:flex;gap:4px;margin:12px 0 0 -12px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-radius:999px;padding:8px 14px;font:600 14.5px var(--sans);color:#C2CBC0;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab[aria-selected="true"]{color:var(--forest-deep);background:var(--gold-soft)}
.tab .n{margin-left:6px;font-weight:500;opacity:.7}

/* ---------- layout ---------- */
main.wrap{padding-top:30px;padding-bottom:30px}
.view[hidden]{display:none}
.block{margin-bottom:44px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 14px}
.sh h2{margin:0;font-family:var(--serif);font-weight:600;font-size:31px;line-height:1.15;color:var(--forest-deep)}
.sh h3{margin:0;font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.2;color:var(--forest-deep)}
.sh .aside{font-size:13px;color:var(--sage);white-space:nowrap}
.lede{color:var(--sage);font-size:14.5px;margin:-6px 0 18px;max-width:68ch}
.lede em,.more em{font-style:italic}

/* today */
.hello{display:flex;justify-content:space-between;align-items:center;gap:28px;background:var(--forest-deep);color:#fff;border-radius:22px;padding:30px 30px 30px 36px;margin:0 0 40px;box-shadow:var(--lift)}
.hello .date{color:var(--gold-soft);font-size:14px;font-weight:600;margin-bottom:10px}
.hello h1{margin:0;font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.2vw,44px);line-height:1.1;color:#fff;max-width:26ch;text-wrap:balance}
.nextup{flex:0 0 270px;background:rgba(255,255,255,.07);border-radius:16px;padding:16px 18px}
.nextup[hidden]{display:none}
.nextup .lbl{font-size:13px;font-weight:600;color:var(--gold-soft)}
.nextup .nd{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.15;color:#fff;margin-top:4px;font-variant-numeric:lining-nums}
.nextup .nt{font-size:14px;color:#D7DED4;margin-top:4px;line-height:1.4}
.nextup .nr{font-size:13px;font-weight:600;color:#F0B48E;margin-top:6px}

.home{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}

/* ---------- lists ---------- */
.sheet{background:var(--paper);border-radius:18px;box-shadow:var(--lift);overflow:hidden}
.row{border-top:1px solid var(--divider)}
.row:first-child{border-top:0}
.row[hidden]{display:none}

.item{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:4px 20px;align-items:start;padding:17px 20px}
.item.nodate{grid-template-columns:minmax(0,1fr) auto}
.when{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.15;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.when small{display:block;font-family:var(--sans);font-size:12.5px;font-weight:600;line-height:1.3;color:var(--sage);margin-top:5px}
.when small.soon{color:var(--brick)}
.when small.now{color:var(--forest)}
.title{font-weight:600;font-size:15.5px;line-height:1.35;color:var(--forest-deep)}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline}
.meta{font-size:13.5px;color:var(--sage);margin-top:3px}
.next{font-size:14.5px;color:#3A453D;margin-top:4px;max-width:60ch}
.hook{font-size:13.5px;color:var(--gold-ink);font-weight:600;margin-top:3px}
.verdict{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tag{display:inline-block;font-size:12px;font-weight:600;line-height:1.3;padding:4px 10px;border-radius:999px}
.t-act{background:#F5DED5;color:#8E3622}
.t-quiet{background:#ECE5D5;color:var(--sage)}
.t-fest{background:#EFE6CF;color:#5D5233}
.t-black{background:#DCE6DC;color:var(--forest)}
.t-hot{background:#F2E4BF;color:var(--gold-ink)}
.t-local{background:#F3E1DA;color:#8E3622}
.ctl{justify-self:end}

details.row > summary{list-style:none;cursor:pointer;transition:background .15s}
details.row > summary::-webkit-details-marker{display:none}
details.row > summary:hover,details.row[open]{background:var(--hover)}
details.row > summary .title::after{content:"";display:inline-block;width:6px;height:6px;margin:0 0 3px 10px;border-right:1.5px solid #BBA672;border-bottom:1.5px solid #BBA672;border-radius:1px;transform:rotate(45deg);transition:transform .15s}
details.row[open] > summary .title::after{transform:rotate(225deg);margin-bottom:0}
.more{padding:4px 20px 20px calc(20px + 104px + 20px);font-size:14.5px;color:#3A453D}
.more > *{max-width:68ch}
.more.nodate{padding-left:20px}
.more p + p{margin-top:8px}
.more strong{color:var(--forest-deep)}
.more .k{font-weight:700;color:var(--gold-ink)}
.note{font-size:13.5px;color:var(--sage);margin-top:6px;max-width:68ch}
.is-passed .title,.is-passed .when{color:#A09B8C}

/* tasks */
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 16px;align-items:start;padding:17px 20px;cursor:pointer;transition:background .15s}
.task:hover{background:var(--hover)}
.box{width:21px;height:21px;border:1.5px solid #CBBE9E;border-radius:7px;margin-top:1px;display:grid;place-items:center;background:#fff;transition:background .15s,border-color .15s}
.box svg{width:11px;height:11px;opacity:0}
.task.done .box{background:var(--forest);border-color:var(--forest)}
.task.done .box svg{opacity:1}
.task .t{font-weight:600;font-size:15px;color:var(--forest-deep);line-height:1.4}
.task .d{font-size:14px;color:#525D55;margin-top:3px;max-width:62ch}
.task.done .t{color:#A09B8C;text-decoration:line-through;text-decoration-thickness:1px}
.task.done .d{display:none}
.due{text-align:right;font-size:13px;color:var(--sage);white-space:nowrap;line-height:1.35}
.due b{display:block;font-family:var(--serif);font-size:17px;font-weight:700;color:var(--gold);font-variant-numeric:lining-nums}
.due .soon,.due .late{color:var(--brick);font-weight:600}
.task.done .due{opacity:.5}

/* status pill */
.status{appearance:none;display:inline-flex;align-items:center;gap:7px;border:0;background:#ECE5D5;border-radius:999px;padding:6px 13px 6px 11px;font:600 12.5px var(--sans);color:var(--forest);cursor:pointer;white-space:nowrap;transition:filter .15s}
.status:hover{filter:brightness(.97)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.status[data-s="working"]{background:#F2E4BF;color:#6B5416}
.status[data-s="submitted"]{background:#E0E8EE;color:#3F5B72}
.status[data-s="confirmed"]{background:var(--forest);color:#fff}
.status[data-s="confirmed"] i{opacity:1;background:var(--gold-soft)}
.status[data-s="passed"]{background:#EEEAE0;color:#9A968A}
.menu{position:absolute;z-index:60;min-width:200px;background:var(--paper);border-radius:16px;box-shadow:0 2px 6px rgba(70,55,20,.08), 0 18px 40px rgba(70,55,20,.16);padding:8px}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;border-radius:10px;font:500 14px var(--sans);color:var(--ink);text-align:left;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:#F1E8D6;outline:none}
.menu button[aria-checked="true"]{color:var(--forest-deep);font-weight:700}
.menu button[aria-checked="true"]::after{content:"✓";margin-left:auto;color:var(--gold)}
.menu button i{width:9px;height:9px;border-radius:50%;flex:none}
.menu .by{font-size:12px;color:var(--sage);padding:8px 12px 4px}

/* side panels */
.panel{background:var(--paper);border-radius:18px;box-shadow:var(--lift);padding:18px 20px;margin-bottom:18px}
.panel h3{margin:0 0 8px;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--forest-deep)}
.feed .ev{font-size:13.5px;line-height:1.45;padding:9px 0;border-top:1px solid var(--divider);color:#3A453D}
.feed .ev:first-child{border-top:0;padding-top:2px}
.feed .ev b{font-weight:700;color:var(--forest-deep)}
.feed time{display:block;font-size:12px;color:var(--gold-ink);margin-top:2px}
.feed .empty{font-size:13.5px;color:var(--sage)}
.links a{display:block;padding:5px 0;font-size:14px;font-weight:600}

/* toolbar */
.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
.search{position:relative;flex:1;min-width:240px;max-width:460px}
.search svg{position:absolute;left:15px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--gold)}
.search input{width:100%;padding:12px 16px 12px 42px;border:0;border-radius:999px;background:var(--paper);box-shadow:var(--lift);font:15px var(--sans);color:var(--ink)}
.search input:focus{outline:2px solid var(--gold-soft);outline-offset:0}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;width:11px;height:11px;cursor:pointer;background:linear-gradient(45deg,transparent 44%,var(--gold) 44%,var(--gold) 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--gold) 44%,var(--gold) 56%,transparent 56%)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--sage);cursor:pointer;user-select:none}
.switch input{width:16px;height:16px;accent-color:var(--forest);margin:0}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 32px}
.jump a{font-size:13.5px;font-weight:600;text-decoration:none;padding:7px 15px;border-radius:999px;background:#EAE0C8;color:var(--forest);transition:background .15s}
.jump a:hover{background:#E1D4B6}
.tier{margin-bottom:30px}
.tier .sh{margin-bottom:4px}
.tier .lede{margin:0 0 12px}
.nomatch{padding:20px;color:var(--sage);font-size:14.5px}
.callout{background:#F6E5DE;border-radius:16px;padding:14px 18px;font-size:14px;color:#5A3B30;margin:0 0 20px;max-width:80ch}
.callout b{color:#8E3622}
details.fold{background:var(--paper);border-radius:18px;box-shadow:var(--lift);padding:0 20px;margin-bottom:14px}
details.fold > summary{list-style:none;cursor:pointer;padding:16px 0}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary .sh{margin:0}
details.fold > summary h3::after{content:"";display:inline-block;width:7px;height:7px;margin:0 0 5px 12px;border-right:1.5px solid #BBA672;border-bottom:1.5px solid #BBA672;border-radius:1px;transform:rotate(45deg);transition:transform .15s}
details.fold[open] > summary h3::after{transform:rotate(225deg);margin-bottom:0}
details.fold .sheet{box-shadow:none;border-radius:0;border-top:1px solid var(--divider);margin:0 -20px}
details.fold .lede{margin:0 0 14px}

/* ledger */
.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 20px;align-items:start;padding:14px 20px}
.ledger .title{font-size:15px}
.rule{display:inline-block;font-size:12px;font-weight:600;white-space:nowrap;padding:4px 11px;border-radius:999px;margin-top:1px}
.rule.no{background:#F5DED5;color:#8E3622}
.rule.angle{background:#F2E4BF;color:var(--gold-ink)}
.plain{font-size:14.5px;max-width:72ch;color:#3A453D}

/* speaking & pipeline */
.speak{background:var(--forest-deep);color:#D7DED4;border-radius:22px;padding:28px 30px 26px}
.speak h3{margin:0 0 8px;font-family:var(--serif);font-weight:600;font-size:27px;color:#fff}
.speak p{max-width:66ch}
.speak strong{color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;padding:10px 18px;border-radius:999px;font:600 14px var(--sans);text-decoration:none;transition:background .15s,color .15s}
.btn.primary{background:var(--gold-soft);color:var(--forest-deep)}
.btn.primary:hover{background:#E2C987}
.btn.secondary{background:rgba(255,255,255,.08);color:#fff}
.btn.secondary:hover{background:rgba(255,255,255,.14)}
dl.facts{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px 24px;margin:24px 0 0;padding:18px 20px;border-radius:16px;background:rgba(255,255,255,.06);font-size:14.5px}
dl.facts dt{font-weight:600;color:var(--gold-soft)}
dl.facts dd{margin:0;color:#E9E4D5}
.plan{padding:20px 22px}
.plan dl.facts{margin:0;padding:0;background:none;border-radius:0}
.plan dl.facts dt{color:var(--forest-deep)}
.plan dl.facts dd{color:#3A453D}
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:start;padding:17px 20px}
.stage.gate{background:#FBEFE9}
.stage .dot{display:none}
.stage .title a{text-decoration:underline;text-decoration-color:#CBBE9E}
.stage .st{font-size:12px;font-weight:600;white-space:nowrap;padding:4px 11px;border-radius:999px;background:#F2E4BF;color:var(--gold-ink)}
.stage.done .st{background:#DCE6DC;color:var(--forest)}
.stage.gate .st{background:#F5DED5;color:#8E3622}

.empty-row{padding:20px;color:var(--sage);font-size:14.5px}

footer{margin-top:10px}
.wrap.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:20px;padding-bottom:48px;font-size:13px;color:var(--sage)}
.foot a{color:var(--forest)}

@media (max-width:920px){
  .home{grid-template-columns:1fr;gap:8px}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .brand span{display:none}
  .account{font-size:12.5px;gap:10px}
  .account .local{display:none}
  .tabs{margin-left:-8px}
  main.wrap{padding-top:20px}
  .hello{flex-direction:column;align-items:stretch;gap:18px;border-radius:20px;padding:22px 20px}
  .nextup{flex:none}
  .sheet,.panel,details.fold{border-radius:16px}
  .item{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:16px}
  .item .when{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;font-size:18px}
  .item .when small{margin-top:0}
  .more{padding-left:16px;padding-right:16px}
  .task{grid-template-columns:22px minmax(0,1fr);padding:16px}
  .task .due{grid-column:2;text-align:left;margin-top:6px}
  .task .due b{display:inline;margin-right:8px}
  dl.facts{grid-template-columns:1fr;gap:2px}
  dl.facts dd{margin-bottom:10px}
  .speak{padding:22px 20px;border-radius:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <p class="brand">Jarrett Adams<span>Opportunity portal</span></p>
      <div class="account" id="account"><span class="local">Progress saves in this browser</span></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Portal sections">
      <button class="tab" role="tab" id="tab-week" aria-controls="view-week" data-view="week">This week<span class="n" data-count="week"></span></button>
      <button class="tab" role="tab" id="tab-events" aria-controls="view-events" data-view="events">Events<span class="n" data-count="events"></span></button>
      <button class="tab" role="tab" id="tab-outreach" aria-controls="view-outreach" data-view="outreach">Outreach<span class="n" data-count="outreach"></span></button>
      <button class="tab" role="tab" id="tab-speaking" aria-controls="view-speaking" data-view="speaking">Speaking &amp; books</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-week" role="tabpanel" aria-labelledby="tab-week"></section>
  <section class="view" id="view-events" role="tabpanel" aria-labelledby="tab-events" hidden></section>
  <section class="view" id="view-outreach" role="tabpanel" aria-labelledby="tab-outreach" hidden></section>
  <section class="view" id="view-speaking" role="tabpanel" aria-labelledby="tab-speaking" hidden></section>
</main>

<footer><div class="wrap foot">
  <span id="foot-note"></span>
  <span id="foot-tools"></span>
</div></footer>

<div class="menu" id="status-menu" role="menu" hidden></div>

  },
  {

  },
  {

  },
  {

 ],
 "updated": "2026-11-17"

<script>
(function(){
'use strict';
const P = window.PORTAL;
const now = new Date();
const STATUS = ['todo', 'working', 'submitted', 'confirmed', 'passed'];
const SLABEL = { todo: 'To do', working: 'In progress', submitted: 'Submitted', confirmed: 'Confirmed', passed: 'Passed' };
const SDOT = { todo: '#B6BDB7', working: '#C9A246', submitted: '#4F7396', confirmed: '#2F7A4D', passed: '#CBD0CB' };
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = iso => new Date(iso + 'T00:00:00');
const eod = iso => new Date(iso + 'T23:59:59');
const until = iso => Math.ceil((day(iso) - now) / 864e5);
const isPast = it => { const e = it.expire || it.end || it.start || it.due; return !!e && eod(e) < now; };
const WORDS = ['No', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];
const word = (n, lower) => { const w = WORDS[n] || String(n); return lower ? w.toLowerCase() : w; };

function windowText(start, end){
  if(!start) return { t: '', c: '' };
  const d = until(start);
  if(d > 1) return { t: 'in ' + d + ' days', c: d <= 14 ? 'soon' : '' };
  if(d === 1) return { t: 'tomorrow', c: 'soon' };
  if(d === 0) return { t: 'today', c: 'soon' };
  if(now <= eod(end || start)) return { t: 'happening now', c: 'now' };
  return { t: '', c: '' };
}
function dueText(iso){
  const d = until(iso);
  const label = day(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const rel = d > 1 ? 'in ' + d + ' days' : d === 1 ? 'tomorrow' : d === 0 ? 'today' : 'overdue';
  return { label, rel, c: d < 0 ? 'late' : d <= 3 ? 'soon' : '' };
}
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if(h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const d = Math.round(h / 24);
  if(d < 7) return d + (d === 1 ? ' day ago' : ' days ago');
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

/* ---------------- state + sync ---------------- */
const KEY = 'jarrett-command-center';
let store;
try { store = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ store = {}; }
store.s = store.s || {}; store.t = store.t || {}; store.f = store.f || {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };
const localBefore = { s: JSON.parse(JSON.stringify(store.s)), t: JSON.parse(JSON.stringify(store.t)) };
const shared = { on: false, me: null, meta: {}, log: [], error: false };
const st = id => store.s[id] || 'todo';

const labelOf = {};
P.actNow.forEach(i => { labelOf[i.id] = i.title; });
P.events.forEach(i => { labelOf[i.id] = i.title; });
P.podcasts.forEach(t => t.items.forEach(i => { labelOf[i.id] = i.title; }));
P.influencers.forEach(t => t.items.forEach(i => { labelOf[i.id] = i.title; }));
P.checklist.forEach(i => { labelOf[i.id] = i.title; });

function adopt(d){
  store.s = d.s || {}; store.t = d.t || {};
  shared.meta = d.meta || {}; shared.log = d.log || []; shared.me = d.me || null;
  shared.on = true; shared.error = false;
  save();
}
function api(method, url, body){
  const opts = { method, credentials: 'same-origin', cache: 'no-store', headers: {} };
  if(body){ opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch(url, opts).then(r => {
    if(r.status === 401){ location.href = '/login'; throw new Error('signed out'); }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}
function pull(){
  if(location.protocol === 'file:') return Promise.reject(new Error('offline file'));
  return api('GET', '/api/state').then(d => { adopt(d); applyState(); return d; });
}
function commit(kind, id, value){
  if(kind === 't' && !value) delete store.t[id]; else store[kind][id] = value;
  save(); applyState();
  if(!shared.on) return;
  api('POST', '/api/update', { kind, id, value, label: labelOf[id] || id })
    .then(d => { adopt(d); applyState(); })
    .catch(err => { if(String(err.message) !== 'signed out'){ shared.error = true; applyAccount(); } });
}
function migrate(){
  const FLAG = 'jarrett-command-center-migrated';
  try { if(localStorage.getItem(FLAG)) return; } catch(e){ return; }
  const s = {}, t = {}, labels = {}; let any = false;
  Object.keys(localBefore.s).forEach(id => { if(localBefore.s[id] && localBefore.s[id] !== 'todo'){ s[id] = localBefore.s[id]; labels[id] = labelOf[id] || id; any = true; } });
  Object.keys(localBefore.t).forEach(id => { if(localBefore.t[id]){ t[id] = true; labels[id] = labelOf[id] || id; any = true; } });
  const done = () => { try { localStorage.setItem(FLAG, '1'); } catch(e){} };
  if(!any){ done(); return; }
  api('POST', '/api/merge', { s, t, labels }).then(d => { done(); adopt(d); applyState(); }).catch(() => {});
}

/* ---------------- building blocks ---------------- */
const statusBtn = id => `<button type="button" class="status" data-sid="${esc(id)}" aria-haspopup="menu"><i></i><span>To do</span></button>`;
const titleHtml = it => it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>` : esc(it.title);
const CHECK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6.3l2.4 2.4 5-5.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function whenCell(it){
  if(!it.start) return `<div class="when">${esc(it.when.split(',')[0])}<small>date TBA</small></div>`;
  const w = windowText(it.start, it.end);
  return `<div class="when">${esc(it.when)}${w.t ? `<small class="${w.c}">${w.t}</small>` : ''}</div>`;
}

/* ---------------- views ---------------- */
function viewWeek(){
  const tasks = P.checklist.filter(t => !isPast(t)).sort((a, b) => a.due.localeCompare(b.due));
  const acts = P.actNow.filter(a => !isPast(a)).sort((a, b) => a.start.localeCompare(b.start));
  const taskRows = tasks.map(t => {
    const d = dueText(t.due);
    return `<div class="row task" role="checkbox" tabindex="0" aria-checked="false" data-tid="${esc(t.id)}">
      <span class="box">${CHECK}</span>
      <div><div class="t">${esc(t.title)}</div><div class="d">${t.body}</div></div>
      <div class="due"><b>${esc(d.label)}</b><span class="${d.c}">${d.rel}</span></div>
    </div>`;
  }).join('') || '<div class="empty-row">Nothing on the list. Add the next batch of tasks when you plan the week.</div>';
  const actRows = acts.map(a => `<details class="row" data-sid-row="${esc(a.id)}">
      <summary class="item">
        ${whenCell(a)}
        <div><div class="title">${esc(a.title)}</div><div class="next">${esc(a.next)}</div></div>
        <div class="ctl">${statusBtn(a.id)}</div>
      </summary>
      <div class="more"><p>${a.body}</p><p class="note">${esc(a.note)}</p>${a.url ? `<p><a href="${esc(a.url)}" target="_blank" rel="noopener">Open the website</a></p>` : ''}</div>
    </details>`).join('') || '<div class="empty-row">No windows closing right now. Events has what\'s next.</div>';
  const links = P.speaking.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')
    + '<a href="https://en.wikipedia.org/wiki/Jarrett_M._Adams" target="_blank" rel="noopener">Wikipedia article</a>';
  return `<div class="hello"><div><p class="date" id="today-date"></p><h1 id="headline"></h1></div><div class="nextup" id="nextup" hidden></div></div>
  <div class="home">
    <div>
      <section class="block" aria-labelledby="h-todo">
        <div class="sh major"><h2 id="h-todo">To do</h2><span class="aside" id="progress" aria-live="polite"></span></div>
        <div class="sheet">${taskRows}</div>
      </section>
      <section class="block" aria-labelledby="h-act">
        <div class="sh major"><h2 id="h-act">Act now</h2><span class="aside">Windows that need a move</span></div>
        <div class="sheet">${actRows}</div>
      </section>
    </div>
    <aside>
      <div class="panel"><h3>Latest updates</h3><div class="feed" id="feed"></div></div>
      <div class="panel links"><h3>Links</h3>${links}</div>
    </aside>
  </div>`;
}

function viewEvents(){
  const evs = P.events.filter(e => !isPast(e)).sort((a, b) => (a.start || a.expire).localeCompare(b.start || b.expire));
  const groups = [];
  evs.forEach(e => {
    const g = e.group || day(e.start).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    let grp = groups.find(x => x.name === g);
    if(!grp){ grp = { name: g, items: [] }; groups.push(grp); }
    grp.items.push(e);
  });
  const rows = items => items.map(e => {
    const quiet = /closed|only/i.test(e.label);
    const TAGCLS = { 'Must attend': 't-hot', 'National stage': 't-hot', 'Home turf': 't-local', 'Hometown': 't-local', 'Black Lit': 't-black', 'Innocence movement': 't-black' };
    const tags = e.tags.map(t => `<span class="tag ${TAGCLS[t] || 't-fest'}">${esc(t)}</span>`).join('');
    return `<details class="row" data-sid-row="${esc(e.id)}">
      <summary class="item">
        ${whenCell(e)}
        <div><div class="title">${esc(e.title)}</div><div class="meta">${esc(e.place)}</div><div class="verdict"><span class="tag ${quiet ? 't-quiet' : 't-act'}">${esc(e.label)}</span>${tags}</div></div>
        <div class="ctl">${statusBtn(e.id)}</div>
      </summary>
      <div class="more"><p>${e.body}</p>${e.url ? `<p><a href="${esc(e.url)}" target="_blank" rel="noopener">Open the event site</a></p>` : ''}</div>
    </details>`;
  }).join('');
  const body = groups.map(g => `<div class="tier"><div class="sh"><h3>${esc(g.name)}</h3><span class="aside">${g.items.length === 1 ? '1 event' : g.items.length + ' events'}</span></div><div class="sheet">${rows(g.items)}</div></div>`).join('')
    || '<div class="sheet"><div class="empty-row">No upcoming events on the list.</div></div>';
  const plan = P.planAhead.map(p => `<dt>${esc(p.k)}</dt><dd>${esc(p.v)}</dd>`).join('');
  return `<div class="sh major"><h2>Events and festivals</h2></div>
  <p class="lede">Click any event for the details. Anything past its last day drops off automatically.</p>
  <div class="toolbar"><label class="switch"><input type="checkbox" data-hide-passed> Hide ones marked passed</label></div>
  ${body}
  <section class="block" style="margin-top:36px">
    <div class="sh"><h3>Next year's application windows</h3></div>
    <p class="lede">Based on the 2026 cycle. Confirm each one in spring.</p>
    <div class="panel plan"><dl class="facts">${plan}</dl></div>
  </section>`;
}

function viewOutreach(){
  const pod = P.podcasts.map(t => `<div class="tier" data-group>
      <div class="sh"><h3>${esc(t.name)}</h3></div><p class="lede">${t.sub}</p>
      <div class="sheet">${t.items.map(i => `<details class="row" data-sid-row="${esc(i.id)}" data-search>
        <summary class="item nodate"><div><div class="title">${esc(i.title)}</div><div class="hook">${esc(i.hook)}</div></div><div class="ctl">${statusBtn(i.id)}</div></summary>
        <div class="more nodate"><p>${i.body}</p></div>
      </details>`).join('')}</div>
    </div>`).join('');
  const inf = P.influencers.map(t => `<div class="tier" data-group>
      <div class="sh"><h3>${esc(t.name)}</h3></div><p class="lede">${t.sub}</p>
      <div class="sheet">${t.items.map(i => `<details class="row" data-sid-row="${esc(i.id)}" data-search>
        <summary class="item nodate"><div><div class="title">${esc(i.title)}</div><div class="meta">${esc(i.reach)}</div></div><div class="ctl">${statusBtn(i.id)}</div></summary>
        <div class="more nodate"><p>${i.body}</p><p><span class="k">Ask:</span> ${i.ask}</p><p class="note">${esc(i.handle)}</p></div>
      </details>`).join('')}</div>
    </div>`).join('');
  const cov = P.covered.groups.map(g => `<details class="tier fold" data-group data-fold>
      <summary><div class="sh"><h3>${esc(g.title)}</h3><span class="aside">${g.items.length} entries</span></div></summary>
      <p class="lede">${esc(g.note)}</p>
      <div class="sheet">${g.items.map(i => `<div class="row ledger" data-search>
        <div><div class="title">${titleHtml(i)}</div><div class="meta">${i.note}</div></div>
        <span class="rule ${/pitch/i.test(i.rule) ? 'no' : 'angle'}">${esc(i.rule)}</span>
      </div>`).join('')}</div>
    </details>`).join('');
  return `<div class="sh major"><h2>Outreach</h2></div>
  <p class="lede">Podcasts, media and book influencers to pitch, and everywhere Jarrett has already been.</p>
  <p class="callout"><b>Search before every pitch.</b> He has already done much of this circuit, including The Breakfast Club and Jason Flom's Wrongful Conviction. Re-pitching a show he has sat for burns the relationship.</p>
  <div class="toolbar">
    <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input type="search" id="search" placeholder="Search shows, outlets and people" aria-label="Search outreach"></label>
    <label class="switch"><input type="checkbox" data-hide-passed> Hide ones marked passed</label>
  </div>
  <nav class="jump" aria-label="Outreach sections"><a href="#o-pod">Podcasts and media</a><a href="#o-inf">Book influencers</a><a href="#o-cov">Already covered</a></nav>
  <section class="block" id="o-pod"><div class="sh major"><h2>Podcasts and media</h2></div>${pod}</section>
  <section class="block" id="o-inf"><div class="sh major"><h2>Book influencers</h2></div>${inf}<p class="note">${esc(P.outreachRule)}</p></section>
  <section class="block" id="o-cov"><div class="sh major"><h2>Already covered</h2></div>
    <p class="lede">The screening list. Red means don't pitch again; gold means only with a genuinely new angle, like a new book, case win or documentary news.</p>
    ${cov}
    <details class="tier fold" data-group data-fold><summary><div class="sh"><h3>Print and feature credits</h3><span class="aside">${P.covered.print.length} outlets</span></div></summary>
      <p class="lede">${esc(P.covered.printNote)}</p>
      <div class="sheet"><div class="row ledger" data-search><p class="plain">${P.covered.print.map(esc).join(', ')}</p></div></div></details>
    <p class="note">${esc(P.covered.caveat)}</p>
  </section>
  <div class="sheet nomatch" id="nomatch" hidden>Nothing matches that search. If he's been on it, add it to Already covered.</div>`;
}

function viewSpeaking(){
  const s = P.speaking;
  const facts = s.facts.map(f => `<dt>${esc(f.k)}</dt><dd>${esc(f.v)}</dd>`).join('');
  const btns = s.links.map((l, i) => `<a class="btn ${i ? 'secondary' : 'primary'}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  const stages = P.pipeline.map(p => `<div class="row stage ${p.state}">
      <span class="dot" aria-hidden="true"></span>

      <span class="st">${esc(p.status)}</span>
    </div>`).join('');
  return `<section class="block"><div class="sh major"><h2>Speaking</h2></div>
    <div class="panel speak"><h3>${esc(s.heading)}</h3><p>${s.body}</p><div class="btns">${btns}</div><dl class="facts">${facts}</dl></div>
  </section>
  <section class="block"><div class="sh major"><h2>Books and presence</h2></div>
    <p class="lede">Where each book property and public profile stands. Red is the gate that holds up the kids' series.</p>
    <div class="sheet">${stages}</div>
  </section>`;
}

/* ---------------- state → screen ---------------- */
function applyAccount(){
  const el = $('#account');
  if(!shared.on){ el.innerHTML = '<span class="local">Progress saves in this browser</span>'; return; }
  el.innerHTML = `<span>${esc(shared.me ? shared.me.name : '')}</span><a href="/logout">Sign out</a>` +
    (shared.error ? '<span class="bad">Last change didn\'t save. Check your connection.</span>' : '');
  const tools = $('#foot-tools');
  if(tools && !tools.firstChild) tools.innerHTML = '<a href="/outreach">Outreach autopilot</a> <a href="/api/export">Download progress</a>';
}
function applyState(){
  $$('.status[data-sid]').forEach(b => {
    const s = st(b.dataset.sid);
    b.dataset.s = s;
    b.lastElementChild.textContent = SLABEL[s];
    b.setAttribute('aria-label', 'Status: ' + SLABEL[s] + '. Change status');
  });
  const hide = store.f.hidePassed === true;
  $$('[data-sid-row]').forEach(r => {
    const passed = st(r.dataset.sidRow) === 'passed';
    r.classList.toggle('is-passed', passed);
    r.toggleAttribute('data-hidden-passed', hide && passed);
  });
  $$('[data-hide-passed]').forEach(c => { c.checked = hide; });

  let open = 0, done = 0, dueWeek = 0;
  $$('.task[data-tid]').forEach(r => {
    const d = !!store.t[r.dataset.tid];
    r.classList.toggle('done', d);
    r.setAttribute('aria-checked', String(d));
    if(d) done++; else { open++; const t = P.checklist.find(x => x.id === r.dataset.tid); if(t && until(t.due) <= 7) dueWeek++; }
  });
  const total = open + done;
  const prog = $('#progress');
  if(prog) prog.textContent = total ? done + ' of ' + total + ' done' : '';

  const actsOpen = P.actNow.filter(a => !isPast(a) && !['submitted', 'confirmed', 'passed'].includes(st(a.id))).length;
  const h = $('#headline');
  if(h){
    let line;
    const tasks = dueWeek === 1 ? 'task' : 'tasks', wins = actsOpen === 1 ? 'window' : 'windows';
    if(dueWeek && actsOpen) line = `${word(dueWeek)} ${tasks} due this week, and ${word(actsOpen, true)} ${wins} to act on.`;
    else if(dueWeek) line = `${word(dueWeek)} ${tasks} due this week.`;
    else if(actsOpen) line = `Nothing due this week. ${word(actsOpen)} ${wins} to act on.`;
    else line = 'All clear for now.';
    h.textContent = line;
  }
  const nu = $('#nextup');
  if(nu){
    const cand = [];
    P.checklist.filter(t => !isPast(t) && !store.t[t.id]).forEach(t => cand.push({ date: t.due, title: t.title, rel: dueText(t.due).rel }));
    P.actNow.filter(a => !isPast(a) && !['submitted', 'confirmed', 'passed'].includes(st(a.id))).forEach(a => {
      const w = windowText(a.start, a.end); cand.push({ date: a.start, title: a.title, rel: w.t, label: a.when });
    });
    cand.sort((x, y) => x.date.localeCompare(y.date));
    const n = cand[0];
    nu.hidden = !n;
    if(n) nu.innerHTML = `<div class="lbl">Next up</div><div class="nd">${esc(n.label || day(n.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }))}</div><div class="nt">${esc(n.title)}</div>${n.rel ? `<div class="nr">${esc(n.rel)}</div>` : ''}`;
  }
  const dEl = $('#today-date');
  if(dEl) dEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  const evOpen = P.events.filter(e => !isPast(e) && st(e.id) !== 'passed').length;
  const outIds = [].concat(...P.podcasts.map(t => t.items), ...P.influencers.map(t => t.items)).map(i => i.id);
  const outOpen = outIds.filter(id => !['confirmed', 'passed'].includes(st(id))).length;
  const counts = { week: open, events: evOpen, outreach: outOpen };
  $$('[data-count]').forEach(n => { const v = counts[n.dataset.count]; n.textContent = v ? String(v) : ''; });

  const feed = $('#feed');
  if(feed){
    if(!shared.on){ feed.innerHTML = '<p class="empty">Sign in to see what the team has changed.</p>'; }
    else if(!shared.log.length){ feed.innerHTML = '<p class="empty">No changes yet. Updates from Ali, Jarrett and Carla show up here.</p>'; }
    else feed.innerHTML = shared.log.slice(0, 6).map(e => {
      const what = e.kind === 't' ? (e.value ? 'ticked ' : 'unticked ') + '“' + esc(e.label) + '”'
        : 'set “' + esc(e.label) + '” to ' + esc((SLABEL[e.value] || e.value).toLowerCase());
      return `<div class="ev"><b>${esc(e.by)}</b> ${what}${e.imported ? ' (from their browser)' : ''}<time datetime="${esc(e.at)}">${ago(e.at)}</time></div>`;
    }).join('');
  }
  runSearch();
  applyAccount();
}

/* ---------------- status menu ---------------- */
const menu = $('#status-menu');
let menuFor = null, menuBtn = null;
function closeMenu(refocus){
  menu.hidden = true; menuFor = null;
  if(refocus && menuBtn) menuBtn.focus();
  menuBtn = null;
}
function openMenu(btn){
  menuBtn = btn; menuFor = btn.dataset.sid;
  const cur = st(menuFor);
  const meta = shared.meta['s:' + menuFor];
  menu.innerHTML = STATUS.map(s => `<button type="button" role="menuitemradio" aria-checked="${s === cur}" data-set="${s}"><i style="background:${SDOT[s]}"></i>${SLABEL[s]}</button>`).join('')
    + (meta ? `<div class="by">Set by ${esc(meta.by)}, ${ago(meta.at)}</div>` : '');
  menu.hidden = false;
  const r = btn.getBoundingClientRect();
  const w = menu.offsetWidth, hgt = menu.offsetHeight;
  let left = r.right + window.scrollX - w;
  left = Math.max(window.scrollX + 10, left);
  let top = r.bottom + window.scrollY + 6;
  if(r.bottom + hgt + 12 > window.innerHeight && r.top > hgt + 12) top = r.top + window.scrollY - hgt - 6;
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
  (menu.querySelector('[aria-checked="true"]') || menu.querySelector('button')).focus();
}
menu.addEventListener('click', e => {
  const b = e.target.closest('[data-set]');
  if(!b) return;
  const id = menuFor;
  closeMenu(true);
  commit('s', id, b.dataset.set);
});
menu.addEventListener('keydown', e => {
  const items = $$('[data-set]', menu);
  const i = items.indexOf(document.activeElement);
  if(e.key === 'ArrowDown'){ e.preventDefault(); items[(i + 1) % items.length].focus(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  else if(e.key === 'Escape' || e.key === 'Tab'){ e.preventDefault(); closeMenu(true); }
});

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const sb = e.target.closest('.status[data-sid]');
  if(sb){
    e.preventDefault(); e.stopPropagation();
    if(!menu.hidden && menuFor === sb.dataset.sid) closeMenu(false); else openMenu(sb);
    return;
  }
  if(!menu.hidden && !menu.contains(e.target)) closeMenu(false);
  const task = e.target.closest('.task[data-tid]');
  if(task && !e.target.closest('a')){
    if(window.getSelection && String(window.getSelection())) return;
    commit('t', task.dataset.tid, !store.t[task.dataset.tid]);
  }
});
document.addEventListener('keydown', e => {
  const task = e.target.closest && e.target.closest('.task[data-tid]');
  if(task && e.target === task && (e.key === ' ' || e.key === 'Enter')){
    e.preventDefault();
    commit('t', task.dataset.tid, !store.t[task.dataset.tid]);
  }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-hide-passed]')){ store.f.hidePassed = e.target.checked; save(); applyState(); }
});
window.addEventListener('resize', () => { if(!menu.hidden) closeMenu(false); });

/* search */
function runSearch(){
  const input = $('#search');
  if(!input) return;
  const q = input.value.trim().toLowerCase();
  const root = $('#view-outreach');
  let shown = 0;
  $$('[data-search]', root).forEach(r => {
    const hit = !q || r.textContent.toLowerCase().includes(q);
    const hiddenPassed = r.hasAttribute('data-hidden-passed');
    r.hidden = !hit || hiddenPassed;
    if(!r.hidden) shown++;
    if(q && hit && r.tagName === 'DETAILS') r.open = true;
  });
  $$('[data-group]', root).forEach(g => {
    g.hidden = !$$('[data-search]', g).some(r => !r.hidden);
    if(g.hasAttribute('data-fold')){
      if(q && !g.hidden){ if(!g.open){ g.open = true; g.dataset.auto = '1'; } }
      else if(!q && g.dataset.auto){ g.open = false; delete g.dataset.auto; }
    }
  });
  $$('#view-outreach > section.block', document).forEach(s => {
    s.hidden = !!q && !$$('[data-search]', s).some(r => !r.hidden);
  });
  $$('#view-outreach .callout, #view-outreach .jump').forEach(el => { el.hidden = !!q; });
  $('#nomatch').hidden = !(q && !shown);
}
document.addEventListener('input', e => { if(e.target.id === 'search') runSearch(); });

/* rows hidden because they're marked passed (events view) */
const hideStyle = document.createElement('style');
hideStyle.textContent = '[data-hidden-passed]{display:none!important}';
document.head.appendChild(hideStyle);

/* ---------------- tabs ---------------- */
const VIEWS = ['week', 'events', 'outreach', 'speaking'];
const LEGACY = { urgent: 'week', checklist: 'week', today: 'week', events: 'events', podcasts: 'outreach', covered: 'outreach', influencers: 'outreach', speaking: 'speaking', publishing: 'speaking' };
function show(view, focusTab){
  if(!VIEWS.includes(view)) view = 'week';
  VIEWS.forEach(v => {
    const on = v === view;
    $('#view-' + v).hidden = !on;
    const t = $('#tab-' + v);
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
  });
  if(focusTab) $('#tab-' + view).focus();
  if(location.hash.slice(1) !== view) history.replaceState(null, '', '#' + view);
  closeMenu(false);
}
$$('.tab').forEach(t => {
  t.addEventListener('click', () => { show(t.dataset.view); window.scrollTo(0, 0); });
  t.addEventListener('keydown', e => {
    const i = VIEWS.indexOf(t.dataset.view);
    if(e.key === 'ArrowRight'){ e.preventDefault(); show(VIEWS[(i + 1) % VIEWS.length], true); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); show(VIEWS[(i - 1 + VIEWS.length) % VIEWS.length], true); }
  });
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if(VIEWS.includes(h)) show(h);
  else if(LEGACY[h]) show(LEGACY[h]);
});

/* ---------------- boot ---------------- */
$('#view-week').innerHTML = viewWeek();
$('#view-events').innerHTML = viewEvents();
$('#view-outreach').innerHTML = viewOutreach();
$('#view-speaking').innerHTML = viewSpeaking();
const updated = day(P.updated).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
$('#foot-note').textContent = 'Content checked ' + updated + '. Anything past its date drops off on its own.';
const h0 = location.hash.slice(1);
show(VIEWS.includes(h0) ? h0 : (LEGACY[h0] || 'week'));
applyState();
pull().then(migrate).catch(() => { /* local file: browser-only mode */ });
setInterval(() => { if(document.visibilityState === 'visible' && shared.on) pull().catch(() => {}); }, 60000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && shared.on) pull().catch(() => {}); });
/* reload just after midnight so expired items drop off on an open tab */
const midnight = new Date(now); midnight.setHours(24, 1, 0, 0);
setTimeout(() => location.reload(), midnight - now);
})();
</script>
